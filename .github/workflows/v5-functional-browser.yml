name: V5 functional browser QA

on:
  push:
    branches: [main]
    paths:
      - v5/**
      - app.js
      - event-persistence.js
      - visual-v3.js
      - visual-v3-refine.js
      - visual-v3-share-card.js
      - visual-v4.js
      - visual-v4-result.js
      - visual-v3.css
      - visual-v3-motion.css
      - visual-v3-polish.css
      - visual-v3-refine.css
      - visual-v3-result-depth.css
      - visual-v4.css
      - visual-v4-result.css
      - data/**
      - tests/v5-functional-live-e2e.mjs
      - .github/workflows/v5-functional-browser.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify installed Chrome
        run: google-chrome --version
      - name: Install browser harness
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Serve public mirror
        run: |
          python3 -m http.server 4174 > /tmp/tdna-v5-live-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4174/v5/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/tdna-v5-live-http.log
          exit 1
      - name: Verify functional V5 flow
        env:
          TRADER_DNA_BASE_URL: http://127.0.0.1:4174
        run: node tests/v5-functional-live-e2e.mjs
      - name: Upload visual checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trader-dna-v5-live-${{ github.sha }}
          path: e2e-v5/
          if-no-files-found: warn
          retention-days: 14
